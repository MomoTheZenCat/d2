<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Stream View</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- setup ---------- */
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0f12; }
  .card { width: min(720px, 92vw); background: #171a1f; border: 1px solid #2a2f37; border-radius: 14px; padding: 28px; }
  .card h1 { margin: 0 0 6px; font-size: 22px; }
  .card p.sub { margin: 0 0 18px; color: #8b93a1; font-size: 14px; }
  .card textarea { width: 100%; height: 240px; resize: vertical; background: #0d0f12; color: #e8e8e8; border: 1px solid #2f3540;
    border-radius: 8px; padding: 12px; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  .row { display: flex; align-items: center; gap: 18px; margin-top: 14px; flex-wrap: wrap; font-size: 14px; }
  .row select { background: #0d0f12; color: #eee; border: 1px solid #2f3540; border-radius: 6px; padding: 4px 8px; }
  .primary { background: #2f7cf6; border: 0; border-radius: 8px; padding: 10px 22px; font-weight: 600; color: #fff; margin-left: auto; }
  .primary:hover { background: #4a8ff8; }
  .warn { background: #3a2a10; border: 1px solid #7a5418; color: #f3c879; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
  .warn code { background: #00000055; padding: 1px 6px; border-radius: 4px; }

  /* ---------- app ---------- */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  .scene { position: absolute; inset: 0; display: grid; gap: 2px; background: #3a3a3a; visibility: hidden; }
  .scene.active { visibility: visible; }
  .tile { position: relative; background: #000; overflow: hidden; min-width: 0; min-height: 0; }
  .tile iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 6px; color: #555; font-size: 15px; text-align: center; padding: 20px; }
  .placeholder.err { color: #e08a8a; }
  .placeholder.empty { cursor: pointer; }
  .placeholder.empty:hover { color: #999; background: #0a0a0a; }

  .ctl { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; gap: 6px; }
  .badge, .zoom { min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; border: 1px solid #ffffff40;
    background: #000000a0; font-weight: 700; font-size: 14px; opacity: .45; transition: opacity .15s; }
  .zoom { opacity: 0; font-size: 15px; }
  .tile:hover .badge, .badge.on, .tile:hover .zoom { opacity: 1; }
  .badge.on { background: #2f7cf6; border-color: #2f7cf6; }
  .tile.vacant .zoom { display: none; }
  #app.clean .badge:not(.on) { opacity: 0; }
  #app.clean .tile:hover .badge { opacity: 1; }

  /* focus mode: one big tile on the left, the rest stacked on the right */
  .scene.focus .tile.big { grid-column: 1; grid-row: 1 / -1; }
  .scene.focus .tile.vacant { display: none; }

  .note { position: absolute; bottom: 12px; left: 12px; z-index: 2; pointer-events: none; max-width: 65%;
    background: rgba(0,0,0,.45); border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; word-break: break-word;
    font-size: var(--note-size, 16px); line-height: 1.35; font-weight: 600; text-shadow: 0 1px 2px #000; }
  .note.br { left: auto; right: 12px; }
  .note:empty { display: none; }

  /* ---------- dock ---------- */
  #dock { flex: none; height: 118px; background: #121418; border-top: 1px solid #262a31; display: flex; align-items: center;
    gap: 10px; padding: 0 14px; transition: transform .2s; z-index: 5; }
  #scenes { flex: 1; display: flex; gap: 14px; justify-content: center; overflow-x: auto; height: 100%; align-items: center; }
  .thumb { flex: none; padding: 6px 8px 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
  .thumb:hover { background: #1b1f26; }
  .thumb.active { border-color: #2f7cf6; background: #182233; }
  .thumb .lbl { font-size: 12px; color: #9aa3b2; margin-bottom: 4px; }
  .thumb.active .lbl { color: #fff; font-weight: 600; }
  .mini { display: grid; gap: 2px; width: 140px; aspect-ratio: 16 / 9; }
  .mini div { background: #2a2e36; border-radius: 3px; font-size: 11px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 3px; color: #ddd; }
  .mini div.void { background: transparent; border: 1px dashed #333; color: #444; }
  .mini div.big { background: #2f7cf6; color: #fff; font-weight: 700; }
  .tools { display: flex; flex-direction: column; gap: 6px; }
  .tools div { display: flex; gap: 6px; }
  .tools button { background: #1e232b; border: 1px solid #2f3540; border-radius: 6px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  .tools button:hover { background: #283040; }

  #app.clean #dock { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(100%); }
  #app.clean.peek #dock { transform: none; }
  #hot { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; z-index: 4; }
  #app.clean #hot { display: block; }

  /* ---------- popover ---------- */
  #pop { position: fixed; z-index: 20; width: 360px; background: #1a1d23f2; backdrop-filter: blur(8px); border: 1px solid #333a45;
    border-radius: 12px; padding: 14px; box-shadow: 0 10px 40px #000a; font-size: 13px; }
  #pop .head { display: flex; align-items: center; margin-bottom: 10px; font-weight: 700; font-size: 15px; }
  #pop .head button { margin-left: auto; background: none; border: 0; font-size: 18px; color: #888; }
  #pop label { display: block; color: #8b93a1; margin: 8px 0 4px; }
  #pop input[type=text], #pop textarea { width: 100%; background: #0d0f12; color: #eee; border: 1px solid #2f3540; border-radius: 6px;
    padding: 7px 9px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #pop textarea { height: 90px; resize: vertical; }
  #pop .line { display: flex; gap: 6px; }
  #pop .line button, #pop .seg button { background: #262b34; border: 1px solid #353c48; border-radius: 6px; padding: 6px 10px; white-space: nowrap; }
  #pop .line button.go { background: #2f7cf6; border-color: #2f7cf6; color: #fff; }
  #pop .seg { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  #pop .seg button.sel { background: #2f7cf6; border-color: #2f7cf6; }
  #pop .seg .danger { margin-left: auto; color: #e08a8a; }
</style>
</head>
<body>

<div id="setup">
  <div class="card">
    <h1>Multi-Stream View</h1>
    <p class="sub">每行（或用空白分隔）貼一個直播網址，支援 YouTube / Twitch。</p>
    <div class="warn" id="fileWarn" hidden>
      目前是用 <code>file://</code> 開啟，YouTube / Twitch 嵌入可能無法播放（Twitch 一定要有網域）。<br>
      請在此檔案所在資料夾執行 <code>python3 -m http.server 8000</code>，再開
      <code>http://localhost:8000/multiview.html</code>
    </div>
    <textarea id="urlInput" spellcheck="false" placeholder="https://www.youtube.com/@momothezencat
https://www.twitch.tv/goatunnheim"></textarea>
    <div class="row">
      <label>每個 Scene 視窗數
        <select id="perScene">
          <option>1</option><option>2</option><option>3</option><option selected>4</option>
          <option>6</option><option>8</option><option>9</option>
        </select>
      </label>
      <label><input type="checkbox" id="muted" checked> 預設靜音（確保自動播放）</label>
      <button class="primary" id="startBtn">開始 ▶</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <div id="stage"></div>
  <div id="hot"></div>
  <div id="dock">
    <div id="scenes"></div>
    <div class="tools">
      <div><button id="fontDown">A−</button><button id="fontUp">A+</button><button id="ratioBtn" title="放大比例">⤢ 70%</button></div>
      <button id="cleanBtn">隱藏 UI (H)</button>
      <button id="editBtn">⚙ 編輯清單</button>
    </div>
  </div>
</div>

<div id="pop" hidden>
  <div class="head"><span id="popTitle">#1</span><button id="popClose" title="關閉 (Esc)">×</button></div>
  <label>直播網址</label>
  <div class="line">
    <input type="text" id="popUrl" spellcheck="false" placeholder="https://www.twitch.tv/...">
    <button class="go" id="popApply">套用</button>
  </div>
  <label>註解（顯示在視窗角落）</label>
  <textarea id="popNote" spellcheck="false" placeholder="名字&#10;fcr: 30, str: 25, fhr: 35"></textarea>
  <div class="seg">
    <span style="color:#8b93a1">位置</span>
    <button data-corner="bl">左下</button>
    <button data-corner="br">右下</button>
    <button class="danger" id="popClear">移除視窗</button>
  </div>
</div>

<script>
const LS_KEY = 'multiview.v1';
const S = Object.assign(
  { urls: [], notes: [], corners: [], perScene: 4, muted: true, scene: 0, noteSize: 16, clean: false,
    focus: [], focusRatio: 70 },   // focus[sceneIndex] = enlarged tile index (or null)
  JSON.parse(localStorage.getItem(LS_KEY) || '{}')
);
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(S));
const $ = id => document.getElementById(id);

// ---------- URL -> embed ----------
function toEmbed(raw) {
  raw = (raw || '').trim();
  if (!raw) return null;
  if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
  let u;
  try { u = new URL(raw); } catch { return { error: '網址格式錯誤' }; }
  const host = u.hostname.replace(/^(www|m)\./, '');

  if (host === 'youtu.be' || host.endsWith('youtube.com')) {
    let id = host === 'youtu.be' ? u.pathname.slice(1).split('/')[0] : u.searchParams.get('v');
    if (!id) {
      const m = u.pathname.match(/^\/(?:live|shorts|embed)\/([\w-]{6,})/);
      if (m) id = m[1];
    }
    if (!id) return { error: '找不到 YouTube 影片 ID\n（請用 watch?v=… 或 /live/… 的網址）' };
    return { src: `https://www.youtube.com/embed/${id}?autoplay=1&mute=${S.muted ? 1 : 0}&playsinline=1&rel=0` };
  }

  if (host.endsWith('twitch.tv')) {
    const parts = u.pathname.split('/').filter(Boolean);
    let q;
    if (u.searchParams.get('channel')) q = 'channel=' + encodeURIComponent(u.searchParams.get('channel'));
    else if (parts[0] === 'videos' && parts[1]) q = 'video=v' + parts[1];
    else if (parts[0]) q = 'channel=' + encodeURIComponent(parts[0].toLowerCase());
    else return { error: '找不到 Twitch 頻道名稱' };
    const parent = location.hostname || 'localhost';
    return { src: `https://player.twitch.tv/?${q}&parent=${parent}&autoplay=true&muted=${S.muted}` };
  }

  return { src: u.href };
}

// ---------- layout ----------
function gridOf(p) {
  const cols = { 1: 1, 2: 2, 3: 3, 4: 2, 6: 3, 8: 4, 9: 3 }[p] || Math.ceil(Math.sqrt(p));
  return { cols, rows: Math.ceil(p / cols) };
}
const sceneCount = () => Math.max(1, Math.ceil(S.urls.length / S.perScene));
const tiles = [];
const sceneEls = [];

function buildStage() {
  const stage = $('stage');
  stage.innerHTML = '';
  tiles.length = 0;
  sceneEls.length = 0;
  for (let s = 0; s < sceneCount(); s++) {
    const scene = document.createElement('div');
    scene.className = 'scene';
    sceneEls[s] = scene;
    for (let k = 0; k < S.perScene; k++) {
      const i = s * S.perScene + k;
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<div class="frame"></div><div class="ctl"><button class="badge">${i + 1}</button>` +
        `<button class="zoom" title="放大 / 還原（數字鍵 ${i + 1}）">⤢</button></div><div class="note"></div>`;
      tile.querySelector('.badge').onclick = e => { e.stopPropagation(); openPop(i, e.currentTarget); };
      tile.querySelector('.zoom').onclick = e => { e.stopPropagation(); toggleFocus(i); };
      scene.appendChild(tile);
      tiles[i] = tile;
      renderTile(i);
    }
    stage.appendChild(scene);
  }
  S.scene = Math.min(S.scene, sceneCount() - 1);
  switchScene(S.scene);
}

// Lays out scene s: normal grid, or (if a tile is focused) big tile on the left at focusRatio% width
// with the remaining live tiles stacked on the right. Only grid placement changes, so iframes keep playing.
function applyFocus(s) {
  const scene = sceneEls[s];
  const p = S.perScene, first = s * p;
  if (!scene || !tiles[first + p - 1]) return;   // scene still being built
  let f = S.focus[s];
  if (f == null || f < first || f >= first + p || !S.urls[f]) f = S.focus[s] = null;
  const others = [];
  for (let i = first; i < first + p; i++) {
    tiles[i].classList.toggle('big', i === f);
    tiles[i].querySelector('.zoom').textContent = i === f ? '⤡' : '⤢';
    if (i !== f && S.urls[i]) others.push(i);
  }
  scene.classList.toggle('focus', f != null);
  if (f == null) {
    const { cols, rows } = gridOf(p);
    scene.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    scene.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  } else if (!others.length) {
    scene.style.gridTemplateColumns = '1fr';
    scene.style.gridTemplateRows = '1fr';
  } else {
    const sideCols = others.length > 4 ? 2 : 1;
    scene.style.gridTemplateColumns = `${S.focusRatio}% repeat(${sideCols}, 1fr)`;
    scene.style.gridTemplateRows = `repeat(${Math.ceil(others.length / sideCols)}, 1fr)`;
  }
}

function toggleFocus(i) {
  const s = Math.floor(i / S.perScene);
  S.focus[s] = S.focus[s] === i ? null : i;
  applyFocus(s);
  if (s !== S.scene) switchScene(s); else { renderDock(); save(); }
}

function renderTile(i) {
  const tile = tiles[i];
  if (!tile) return;
  const frame = tile.querySelector('.frame');
  const emb = toEmbed(S.urls[i]);
  const key = emb ? (emb.src || 'err:' + emb.error) : 'empty';
  if (frame.dataset.key !== key) {
    frame.dataset.key = key;
    frame.innerHTML = '';
    if (!emb) {
      const ph = document.createElement('div');
      ph.className = 'placeholder empty';
      ph.innerHTML = `<div style="font-size:34px">＋</div><div>點這裡加入直播網址</div>`;
      ph.onclick = () => openPop(i, tile.querySelector('.badge'));
      frame.appendChild(ph);
    } else if (emb.error) {
      const ph = document.createElement('div');
      ph.className = 'placeholder err';
      ph.style.whiteSpace = 'pre-line';
      ph.textContent = emb.error;
      frame.appendChild(ph);
    } else {
      const f = document.createElement('iframe');
      f.src = emb.src;
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      frame.appendChild(f);
    }
  }
  const note = tile.querySelector('.note');
  note.textContent = (S.notes[i] || '').trim();
  note.classList.toggle('br', S.corners[i] === 'br');
  tile.classList.toggle('vacant', !S.urls[i]);
  applyFocus(Math.floor(i / S.perScene));
}

function renderDock() {
  const box = $('scenes');
  box.innerHTML = '';
  const { cols, rows } = gridOf(S.perScene);
  for (let s = 0; s < sceneCount(); s++) {
    const t = document.createElement('div');
    t.className = 'thumb' + (s === S.scene ? ' active' : '');
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = `Scene ${s + 1}`;
    const mini = document.createElement('div');
    mini.className = 'mini';
    mini.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    mini.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    for (let k = 0; k < S.perScene; k++) {
      const i = s * S.perScene + k;
      const cell = document.createElement('div');
      const name = (S.notes[i] || '').trim().split('\n')[0];
      if (!S.urls[i]) cell.className = 'void';
      else if (S.focus[s] === i) cell.className = 'big';
      cell.textContent = name ? `${i + 1} ${name}` : `${i + 1}`;
      mini.appendChild(cell);
    }
    t.append(lbl, mini);
    t.onclick = () => switchScene(s);
    box.appendChild(t);
  }
}

function switchScene(s) {
  S.scene = Math.max(0, Math.min(s, sceneCount() - 1));
  document.querySelectorAll('.scene').forEach((el, idx) => el.classList.toggle('active', idx === S.scene));
  closePop();
  renderDock();
  save();
}

function applyNoteSize() { document.documentElement.style.setProperty('--note-size', S.noteSize + 'px'); }
function applyClean() {
  $('app').classList.toggle('clean', S.clean);
  $('app').classList.remove('peek');
  $('cleanBtn').textContent = S.clean ? '顯示 UI (H)' : '隱藏 UI (H)';
}

// ---------- popover ----------
let popIdx = -1;
function openPop(i, anchor) {
  popIdx = i;
  document.querySelectorAll('.badge.on').forEach(b => b.classList.remove('on'));
  tiles[i].querySelector('.badge').classList.add('on');
  $('popTitle').textContent = `#${i + 1}`;
  $('popUrl').value = S.urls[i] || '';
  $('popNote').value = S.notes[i] || '';
  markCorner();
  const pop = $('pop');
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.bottom + 8, innerHeight - h - 8)) + 'px';
  (S.urls[i] ? $('popNote') : $('popUrl')).focus();
}
function closePop() {
  $('pop').hidden = true;
  popIdx = -1;
  document.querySelectorAll('.badge.on').forEach(b => b.classList.remove('on'));
}
function markCorner() {
  const c = S.corners[popIdx] === 'br' ? 'br' : 'bl';
  document.querySelectorAll('#pop [data-corner]').forEach(b => b.classList.toggle('sel', b.dataset.corner === c));
}
function setUrl(i, url) {
  while (S.urls.length < i) S.urls.push('');
  S.urls[i] = url;
  renderTile(i);
  renderDock();
  save();
}

$('popApply').onclick = () => setUrl(popIdx, $('popUrl').value.trim());
$('popUrl').onkeydown = e => { if (e.key === 'Enter') $('popApply').click(); };
$('popNote').oninput = () => { S.notes[popIdx] = $('popNote').value; renderTile(popIdx); renderDock(); save(); };
document.querySelectorAll('#pop [data-corner]').forEach(b => b.onclick = () => {
  S.corners[popIdx] = b.dataset.corner; markCorner(); renderTile(popIdx); save();
});
$('popClear').onclick = () => { $('popUrl').value = ''; setUrl(popIdx, ''); };
$('popClose').onclick = closePop;
document.addEventListener('mousedown', e => {
  if (!$('pop').hidden && !$('pop').contains(e.target) && !e.target.closest('.badge, .placeholder.empty')) closePop();
});

// ---------- dock tools ----------
$('fontDown').onclick = () => { S.noteSize = Math.max(10, S.noteSize - 2); applyNoteSize(); save(); };
$('fontUp').onclick = () => { S.noteSize = Math.min(48, S.noteSize + 2); applyNoteSize(); save(); };
$('cleanBtn').onclick = () => { S.clean = !S.clean; applyClean(); save(); };
$('hot').onmouseenter = () => $('app').classList.add('peek');
$('dock').onmouseleave = () => $('app').classList.remove('peek');
$('editBtn').onclick = showSetup;
const RATIOS = [60, 70, 80];
function applyRatio() {
  $('ratioBtn').textContent = `⤢ ${S.focusRatio}%`;
  sceneEls.forEach((_, s) => applyFocus(s));
}
$('ratioBtn').onclick = () => {
  S.focusRatio = RATIOS[(RATIOS.indexOf(S.focusRatio) + 1) % RATIOS.length];
  applyRatio();
  save();
};

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || $('app').hidden) {
    if (e.key === 'Escape') closePop();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (!$('pop').hidden) closePop();
    else if (S.focus[S.scene] != null) toggleFocus(S.focus[S.scene]);
  }
  else if (/^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (S.urls[i]) toggleFocus(i); }
  else if (e.key === '0' && S.focus[S.scene] != null) toggleFocus(S.focus[S.scene]);
  else if (e.key === 'ArrowRight') switchScene(S.scene + 1);
  else if (e.key === 'ArrowLeft') switchScene(S.scene - 1);
  else if (e.key.toLowerCase() === 'h') $('cleanBtn').click();
});

// ---------- setup ----------
function showSetup() {
  closePop();
  $('app').hidden = true;
  $('stage').innerHTML = '';   // stop all streams
  $('setup').hidden = false;
  $('urlInput').value = S.urls.filter(Boolean).join('\n');
  $('perScene').value = String(S.perScene);
  $('muted').checked = S.muted;
  $('urlInput').focus();
}
function startApp() {
  $('setup').hidden = true;
  $('app').hidden = false;
  applyNoteSize();
  applyClean();
  buildStage();
  applyRatio();
}
$('startBtn').onclick = () => {
  const urls = $('urlInput').value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
  if (!urls.length) { $('urlInput').focus(); return; }
  S.urls = urls;
  S.focus = [];
  S.perScene = +$('perScene').value;
  S.muted = $('muted').checked;
  save();
  startApp();
};

$('fileWarn').hidden = location.protocol !== 'file:';
showSetup();
</script>
</body>
</html>
